version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /test-project
    schedule:
      interval: weekly
      day: tuesday
      time: '04:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    ignore:
      # majors are upgraded by hand
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod-patch:
        dependency-type: production
        update-types: [patch]
      npm-prod-minor:
        dependency-type: production
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '04:30'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
